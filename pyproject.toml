[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "Kleine Python-String-Bibliothek mit fünf einfachen String-Hilfsfunktionen."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["textutils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
